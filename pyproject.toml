[project]
name = "icu-eol-dnr-pilot-analysis"
version = "0.1.0"
description = "Reproducible analysis for a pilot cross-sectional ICU end-of-life and DNR survey"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
